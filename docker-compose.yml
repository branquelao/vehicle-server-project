services:
  db:
    image: postgres:16
    container_name: pg-veiculos
    restart: unless-stopped
    environment:
      POSTGRES_DB: veiculos_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d veiculos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: appcompraveiculoserver
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-troque-por-uma-chave-secreta-longa-de-pelo-menos-256-bits}
      # Sobrescreve o valor fixo em application.properties (localhost) — variáveis
      # de ambiente têm prioridade maior que application.properties no Spring Boot,
      # então isso funciona sem tocar no código-fonte.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/veiculos_db
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  pg_data:
  uploads_data:
